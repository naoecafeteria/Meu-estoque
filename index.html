<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0C1119">
<title>Meus cafés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#0C1119;
    --tinta-alta:#141C28;
    --tinta-borda:#22303F;
    --leite:#E8E4DC;
    --leite-fraco:#9AA5B1;
    --cobre:#C98A4B;
    --verde:#6F8F6A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0C1119 !important}
  #fundo{position:fixed;inset:0;background:#0C1119;z-index:-1}
  body{
    background:#0C1119 !important;
    color-scheme:dark;
    color:var(--leite);
    font-family:Inter,system-ui,sans-serif;
    font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .folha{max-width:860px;margin:0 auto;padding:26px 20px 80px;
    background:#0C1119;min-height:100vh}

  header.capa{padding:20px 0 24px;border-bottom:1px solid var(--tinta-borda);display:flex;align-items:center;gap:15px}
  .grao{flex:0 0 auto}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(27px,6.5vw,36px);margin:0;
    letter-spacing:-.025em;line-height:1.05}
  .subtitulo{margin:2px 0 0;font-size:14px;color:var(--leite-fraco)}

  nav{display:flex;gap:8px;margin:20px 0 0;flex-wrap:wrap}
  nav button{
    background:transparent;border:1px solid var(--tinta-borda);border-radius:999px;
    padding:7px 15px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--leite-fraco);
  }
  nav button[aria-current="true"]{background:var(--leite);border-color:var(--leite);color:var(--tinta);font-weight:500}
  nav button:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cobre);outline-offset:2px}

  .busca{width:100%;margin:14px 0 0;padding:11px 14px;border:1px solid var(--tinta-borda);border-radius:10px;
    background:var(--tinta-alta);font-family:inherit;font-size:15px;color:var(--leite)}
  .busca::placeholder{color:var(--leite-fraco)}

  .secao-titulo{font-family:Fraunces,serif;font-weight:600;font-size:20px;margin:30px 0 14px}
  .secao-nota{margin:0 0 14px;font-size:14px;color:var(--leite-fraco)}

  .item{
    width:100%;text-align:left;background:var(--tinta-alta);border:1px solid var(--tinta-borda);
    border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;display:flex;gap:14px;
    align-items:center;color:inherit;font-family:inherit;
  }
  .item:hover{border-color:var(--cobre)}
  .item .miniatura{width:60px;height:60px;flex:0 0 60px;border-radius:9px;object-fit:cover;background:#1B2530}
  .item .corpo{flex:1;min-width:0}
  .item .titulo{font-family:Fraunces,serif;font-weight:600;font-size:17px;line-height:1.3;margin:0;
    display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .item .codigo{font-size:12px;color:var(--cobre);font-family:ui-monospace,monospace;white-space:nowrap}
  .item .linha2{display:block;margin:3px 0 0;font-size:13px;color:var(--leite-fraco)}
  .item .notas{display:block;margin:5px 0 0;font-size:14px;font-family:Fraunces,serif;font-style:italic;color:var(--leite)}

  .vazio{padding:44px 0;text-align:center;color:var(--leite-fraco)}

  .voltar{background:none;border:0;padding:0;margin:0 0 18px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--leite-fraco)}
  .ficha h2{font-family:Fraunces,serif;font-weight:600;font-size:clamp(25px,6vw,34px);margin:0;line-height:1.15;letter-spacing:-.015em}
  .ficha .origem{margin:6px 0 0;font-size:15px;color:var(--leite-fraco)}
  .selo{display:inline-block;margin:14px 0 0;padding:4px 11px;border-radius:999px;font-size:12px;
    font-family:ui-monospace,monospace;background:var(--tinta-alta);border:1px solid var(--tinta-borda);color:var(--leite-fraco)}
  .foto{width:100%;max-height:400px;object-fit:cover;margin:20px 0 0;border-radius:14px;background:var(--tinta-alta)}

  .sensorial{margin:22px 0 0;font-family:Fraunces,serif;font-style:italic;font-size:22px;line-height:1.4;
    color:var(--leite);border-left:2px solid var(--cobre);padding-left:16px}

  dl.dados{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;margin:26px 0 0}
  dl.dados div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--tinta-borda)}
  dl.dados dt{color:var(--leite-fraco);font-size:14px;margin:0}
  dl.dados dd{margin:0;text-align:right;font-size:14px;font-weight:500}

  .bloco{margin:26px 0 0;background:var(--tinta-alta);border:1px solid var(--tinta-borda);border-radius:12px;padding:16px}
  .bloco h3{font-family:Fraunces,serif;font-size:16px;margin:0 0 6px;font-weight:600}
  .bloco p{margin:0;font-size:15px}

  .qr{margin:26px 0 0;padding:16px;border:1px dashed var(--tinta-borda);border-radius:12px}
  .qr p{margin:0 0 8px;font-size:13px;color:var(--leite-fraco)}
  .qr code{display:block;word-break:break-all;font-size:12px;font-family:ui-monospace,monospace;
    color:var(--cobre);margin-bottom:12px}
  .btn{background:var(--cobre);color:#17110A;border:0;padding:10px 18px;border-radius:9px;
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .btn.secundario{background:transparent;color:var(--leite);border:1px solid var(--tinta-borda);font-weight:400}

  form.novo label{display:block;margin:14px 0 0;font-size:13px;color:var(--leite-fraco)}
  form.novo input,form.novo textarea{
    width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--tinta-borda);border-radius:9px;
    background:var(--tinta-alta);font-family:inherit;font-size:15px;color:var(--leite)}
  form.novo textarea{min-height:74px;resize:vertical}
  form.novo input[type=file]{padding:9px;color:var(--leite-fraco);font-size:14px}
  .anotacao{margin:20px 0 0;padding:18px;border:1px solid var(--cobre);border-radius:14px;background:var(--tinta-alta)}
  .anotacao h3{font-family:Fraunces,serif;font-size:17px;margin:0;font-weight:600}
  .anotacao .btn{width:auto}
  .anotacao .btn.secundario{margin-left:10px}
  .bloco h3 .contador{float:right;font-size:13px}
  .extracao{padding:14px 0;border-bottom:1px solid var(--tinta-borda)}
  .extracao:last-of-type{border-bottom:0;padding-bottom:0}
  .ext-data{margin:0;font-size:12px;font-family:ui-monospace,monospace;color:var(--leite-fraco)}
  .ext-topo{margin:4px 0 0;font-size:15px;font-weight:500}
  .ext-det{margin:3px 0 0;font-size:14px;color:var(--leite-fraco)}
  .ext-notas{margin:6px 0 0;font-size:15px;font-family:Fraunces,serif;font-style:italic}
  .ext-apagar{font-size:12px;padding:6px 0 0}
  .apagar-linha{margin:30px 0 0;text-align:center}
  .apagar{background:none;border:0;padding:8px;cursor:pointer;font-family:inherit;
    font-size:14px;color:#E0705F;text-decoration:underline}
  .erro{margin:16px 0 0;font-size:14px;color:#E0705F}
  .previa{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:12px}
  .duas{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  pre.saida{white-space:pre-wrap;word-break:break-word;background:var(--tinta-alta);border:1px solid var(--tinta-borda);
    padding:14px;border-radius:12px;font-size:12px;font-family:ui-monospace,monospace;margin-top:16px;color:var(--leite)}

  .contador{float:right;font-family:Inter,sans-serif;font-size:13px;font-weight:400;color:var(--cobre)}
  .barra{display:block;height:4px;border-radius:2px;background:#22303F;margin:8px 0 4px;overflow:hidden}
  .barra-cheia{display:block;height:100%;background:var(--cobre)}
  .estoque{margin:20px 0 0;padding:18px;border:1px solid var(--tinta-borda);border-radius:14px;background:var(--tinta-alta)}
  .estoque-num{margin:0;font-family:Fraunces,serif;font-size:15px;color:var(--leite-fraco)}
  .estoque-num strong{font-size:34px;font-weight:600;color:var(--leite);margin-right:4px}
  .estoque-rot{margin:16px 0 8px;font-size:14px;color:var(--leite-fraco)}
  .contagem{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .contagem input{width:76px;text-align:center;padding:10px;border:1px solid var(--tinta-borda);
    border-radius:9px;background:var(--tinta);color:var(--leite);font-family:inherit;font-size:18px;font-weight:600}
  .passo{width:44px;height:44px;border-radius:50%;border:1px solid var(--tinta-borda);background:transparent;
    color:var(--leite);font-size:22px;line-height:1;cursor:pointer}
  .estoque .btn{width:100%;padding:13px}
  .estoque .btn.secundario{margin-top:8px}

  footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--tinta-borda);
    text-align:center;font-size:13px;color:var(--leite-fraco)}

  @media (max-width:560px){dl.dados,.duas{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const API = SUPABASE_URL + "/rest/v1/cafes";

const CABECALHOS = {
  "apikey": SUPABASE_KEY,

async function carregar(){
  carregando = true; falha = "";
  try {
    const r = await fetch(API + "?select=*&order=criado_em.desc", { headers: CABECALHOS });

  carregando = false;
  render();
}

async function salvarConsumo(id, valor){
  const r = await fetch(API + "?id=eq." + encodeURIComponent(id), {
    method: "PATCH", headers: CABECALHOS, body: JSON.stringify({ consumidas: valor })
  });
  if (!r.ok) throw new Error(await r.text());
}

async function salvarCafe(dados){
  const r = await fetch(API, {
    method: "POST", headers: CABECALHOS,
    body: JSON.stringify({ id: dados.id, dados: dados, consumidas: 0 })
  });
  if (!r.ok) throw new Error(await r.text());
}

async function apagarCafe(id){
  const r = await fetch(API + "?id=eq." + encodeURIComponent(id), {
    method: "DELETE", headers: CABECALHOS
  });
  if (!r.ok) throw new Error(await r.text());
}

async function salvarExtracao(cafeId, dados){
  const r = await fetch(API_EXT, {
    method: "POST", headers: Object.assign({}, CABECALHOS, {"Prefer":"return=representation"}),
    body: JSON.stringify({ cafe_id: cafeId, dados: dados })
  });
  if (!r.ok) throw new Error(await r.text());
  return (await r.json())[0];
}

async function apagarExtracao(id){
  const r = await fetch(API_EXT + "?id=eq." + id, { method: "DELETE", headers: CABECALHOS });
  if (!r.ok) throw new Error(await r.text());
}

function extracoesDo(cafeId){
  return extracoes.filter(e => e.cafe_id === cafeId);
}

function dataCurta(iso){
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", year:"2-digit" })
      + " às " + d.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });
  } catch { return ""; }
}

function achaCafe(id){ return cafes.find(c => c.id === id); }
function total(c){ return Number(c.doses || 0); }
function restam(c){ return Math.max(0, total(c) - Number(c.consumidas || 0)); }
function emEstoque(c){ return total(c) === 0 ? true : restam(c) > 0; }

const linkDo = id => location.origin + location.pathname + "#c=" + id;

function filtrados(estoque){
  const t = termo.trim().toLowerCase();
  return cafes.filter(c => emEstoque(c) === estoque).filter(c => !t ||
    [c.nome,c.produtor,c.regiao,c.variedade,c.processo,c.notas,c.torrefacao,c.id]
      .join(" ").toLowerCase().includes(t));
}

function cardapio(){
  const estoque = filtrados(true);
  const arquivo = filtrados(false);
  const lista = aba === "estoque" ? estoque : arquivo;
  const dosesTotais = estoque.reduce((s,c) => s + restam(c), 0);

  const itens = lista.map(c => `
    <button class="item" data-id="${esc(c.id)}">
      ${c.foto ? `<img class="miniatura" src="${esc(c.foto)}" alt="" onerror="this.style.visibility='hidden'">`
               : `<span class="miniatura"></span>`}
      <span class="corpo">
        <span class="titulo"><span>${esc(c.nome)}</span><span class="codigo">${esc(c.id)}</span></span>
        <span class="linha2">${[c.regiao,c.processo,c.variedade].filter(Boolean).map(esc).join(" · ")}</span>
        ${c.notas ? `<span class="notas">${esc(c.notas)}</span>` : ""}
        ${total(c) ? `<span class="barra"><span class="barra-cheia" style="width:${(restam(c)/total(c))*100}%"></span></span>
        <span class="linha2">${restam(c)} de ${total(c)} doses</span>` : ""}
      </span>
    </button>`).join("");

  return `
    <nav>
      <button data-aba="estoque" aria-current="${aba==="estoque"}">Meu estoque (${estoque.length})</button>
      <button data-aba="historico" aria-current="${aba==="historico"}">Histórico (${arquivo.length})</button>
      <button data-aba="cadastrar" aria-current="${aba==="cadastrar"}">Cadastrar</button>
    </nav>
    <input class="busca" id="busca" placeholder="Buscar por nome, região, processo…" value="${esc(termo)}">
    ${aba==="estoque"
      ? `<h2 class="secao-titulo">Meu estoque<span class="contador">${dosesTotais} doses</span></h2>`
      : `<h2 class="secao-titulo">Histórico</h2>`}
    ${itens || `<p class="vazio">${aba==="estoque"
      ? "Estoque vazio. Cadastre um café na aba Cadastrar."
      : "Nenhum café terminou ainda."}</p>`}
  `;
}

function ficha(c){
  const dado = (r,v) => v ? `<div><dt>${r}</dt><dd>${esc(v)}</dd></div>` : "";
  const t = total(c), r = restam(c);
  const controle = t ? `
    <section class="estoque">
      <p class="estoque-num"><strong>${r}</strong> de ${t} doses</p>
      <span class="barra"><span class="barra-cheia" style="width:${(r/t)*100}%"></span></span>
      ${r > 0 ? `
        <p class="estoque-rot">Quantas doses foram tomadas?</p>
        <div class="contagem">
          <button class="passo" id="menos" aria-label="Diminuir">−</button>
          <input id="qtd" type="number" inputmode="numeric" min="1" max="${r}" value="1">
          <button class="passo" id="mais" aria-label="Aumentar">+</button>
        </div>
        <button class="btn" id="confirmar">Confirmar baixa</button>`
        : `<p class="estoque-rot">Este café acabou.</p>`}
      ${Number(c.consumidas) > 0 ? `<button class="btn secundario" id="desfazer">Devolver 1 dose</button>` : ""}
      <p class="erro" id="erroBaixa" hidden></p>
    </section>` : "";

  const campoE = (n,r,t="input") => t==="textarea"
    ? `<label>${r}<textarea name="${n}"></textarea></label>`
    : `<label>${r}<input name="${n}"></label>`;

  const painel = anotando ? `
    <section class="anotacao">
      <h3>Anote esta extração</h3>
      <p class="estoque-rot">Tudo opcional. Preencha só o que interessa.</p>
      <form class="novo" id="formExt">
        <div class="duas">
          ${campoE("metodo","Método de extração")}
          ${campoE("moedor","Moedor")}
          ${campoE("click","Click do moedor")}
          ${campoE("proporcao","Proporção")}
          ${campoE("temperatura","Temperatura da água")}
          ${campoE("tempo","Tempo final")}
        </div>
        ${campoE("receita","Receita, incluindo os despejos","textarea")}
        ${campoE("notas","Notas desta extração","textarea")}
        <p class="erro" id="erroExt" hidden></p>
        <p style="margin-top:16px">
          <button type="button" class="btn" id="salvarExt">Salvar extração</button>
          <button type="button" class="btn secundario" id="pularExt">Agora não</button>
        </p>
      </form>
    </section>` : "";

  const lista = extracoesDo(c.id);
  const historico = lista.length ? `
    <section class="bloco">
      <h3>Minhas extrações<span class="contador">${lista.length}</span></h3>
      ${lista.map(e => {
        const d = e.dados || {};
        const topo = [d.metodo, d.proporcao, d.tempo].filter(Boolean).map(esc).join(" · ");
        const detalhes = [
          d.moedor ? "Moedor: " + d.moedor : "",
          d.click ? "Click: " + d.click : "",
          d.temperatura ? "Água: " + d.temperatura : ""
        ].filter(Boolean).map(esc).join(" · ");
        return `<div class="extracao">
          <p class="ext-data">${esc(dataCurta(e.criado_em))}</p>
          ${topo ? `<p class="ext-topo">${topo}</p>` : ""}
          ${detalhes ? `<p class="ext-det">${detalhes}</p>` : ""}
          ${d.receita ? `<p class="ext-det">${esc(d.receita)}</p>` : ""}
          ${d.notas ? `<p class="ext-notas">${esc(d.notas)}</p>` : ""}
          <button class="apagar ext-apagar" data-ext="${e.id}">Apagar</button>
        </div>`;
      }).join("")}
    </section>` : "";

  return `
    <button class="voltar" id="voltar">← Voltar</button>
    <article class="ficha">
      <h2>${esc(c.nome)}</h2>
      <p class="origem">${[c.produtor,c.regiao].filter(Boolean).map(esc).join(", ")}</p>
      <span class="selo">${r > 0 || !t ? "Em estoque" : "Acabou"} · ${esc(c.id)}</span>
      ${controle}
      ${painel}
      ${c.foto ? `<img class="foto" src="${esc(c.foto)}" alt="Embalagem do café ${esc(c.nome)}" onerror="this.remove()">` : ""}
      ${c.notas ? `<p class="sensorial">${esc(c.notas)}</p>` : ""}
      <dl class="dados">
        ${dado("Variedade",c.variedade)}
        ${dado("Processo",c.processo)}
        ${dado("Altitude",c.altitude)}
        ${dado("Torra",c.torra)}
        ${dado("Torrefação",c.torrefacao)}
        ${dado("Pontuação",c.pontuacao)}
        ${dado("Torrado em",c.dataTorra)}
        ${dado("Porcionado em",c.dataPorcao)}
        ${dado("Peso do pacote",c.pesoTotal)}
        ${dado("Doses porcionadas",t || "")}
        ${dado("Peso por dose",c.pesoDose)}
      </dl>
      ${historico}
      <div class="qr">
        <p>Link desta ficha, para colar no gerador de QR do app da impressora:</p>
        <code id="link">${esc(linkDo(c.id))}</code>
        <button class="btn secundario" id="copiar">Copiar link</button>
      </div>
      <p class="apagar-linha"><button class="apagar" id="apagar">Apagar este café</button></p>
    </article>`;
}

function formulario(){
  const campo = (n,r,t="input") => t==="textarea"
    ? `<label>${r}<textarea name="${n}"></textarea></label>`
    : `<label>${r}<input name="${n}"></label>`;
  return `
    <nav>
      <button data-aba="estoque" aria-current="false">Meu estoque</button>
      <button data-aba="historico" aria-current="false">Histórico</button>
      <button data-aba="cadastrar" aria-current="true">Cadastrar</button>
    </nav>
    <h2 class="secao-titulo">Cadastrar um café</h2>
    <form class="novo" id="form">
      <div class="duas">
        ${campo("id","Código da etiqueta (ex.: C002)")}
        ${campo("nome","Nome do café")}
        ${campo("produtor","Produtor ou fazenda")}
        ${campo("regiao","Região")}
        ${campo("variedade","Variedade")}
        ${campo("processo","Processo")}
        ${campo("altitude","Altitude")}
        ${campo("torra","Torra")}
        ${campo("torrefacao","Torrefação")}
        ${campo("pontuacao","Pontuação")}
        ${campo("dataTorra","Data da torra")}
        ${campo("dataPorcao","Data do porcionamento")}
        ${campo("pesoTotal","Peso do pacote")}
        ${campo("doses","Quantas doses porcionadas")}
        ${campo("pesoDose","Peso por dose")}
      </div>
      ${campo("notas","Notas sensoriais")}
      <label>Foto da embalagem
        <input type="file" id="arquivoFoto" accept="image/*">
      </label>
      <img id="previaFoto" class="previa" alt="" hidden>
      <p class="erro" id="erro" hidden></p>
      <p style="margin-top:18px"><button type="button" class="btn" id="gerar">Cadastrar café</button></p>
    </form>`;
}

function render(){
  if (carregando){ app.innerHTML = `<p class="vazio">Carregando seus cafés…</p>`; return; }
  if (falha){ app.innerHTML = `<p class="vazio">${esc(falha)}</p>`; return; }

  const h = location.hash.match(/^#c=(.+)$/);
  if (h){
    const c = achaCafe(decodeURIComponent(h[1]));
    app.innerHTML = c ? ficha(c)
      : `<p class="vazio">Não encontrei o café ${esc(decodeURIComponent(h[1]))}.</p>
         <p style="text-align:center"><button class="btn secundario" id="voltar">Ver meu estoque</button></p>`;
  } else {
    app.innerHTML = aba === "cadastrar" ? formulario() : cardapio();
  }
  ligar();
}

function ligar(){
  document.querySelectorAll("nav button").forEach(b =>
    b.onclick = () => { aba = b.dataset.aba; termo = ""; anotando = false; location.hash = ""; window.scrollTo(0,0); render(); });

  const busca = document.getElementById("busca");
  if (busca) busca.oninput = e => {
    termo = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const novo = document.getElementById("busca");
    novo.focus(); novo.setSelectionRange(pos,pos);
  };

  document.querySelectorAll(".item").forEach(b =>
    b.onclick = () => { window.scrollTo(0,0); location.hash = "c=" + encodeURIComponent(b.dataset.id); });

  const voltar = document.getElementById("voltar");
  if (voltar) voltar.onclick = () => { anotando = false; window.scrollTo(0,0); location.hash = ""; };

  const qtd = document.getElementById("qtd");
  const passo = d => { qtd.value = Math.min(Number(qtd.max), Math.max(1, Number(qtd.value || 1) + d)); };
  const menos = document.getElementById("menos");
  const mais = document.getElementById("mais");
  if (menos) menos.onclick = () => passo(-1);
  if (mais) mais.onclick = () => passo(1);

  async function mover(n, botao){
    const id = decodeURIComponent(location.hash.match(/^#c=(.+)$/)[1]);
    const c = achaCafe(id);
    const alvo = Math.min(total(c), Math.max(0, Number(c.consumidas || 0) + n));
    const rotulo = botao.textContent;
    botao.disabled = true; botao.textContent = "Salvando…";
    try {
      await salvarConsumo(id, alvo);
      c.consumidas = alvo;
      anotando = n > 0;
      render();
    } catch {
      botao.disabled = false; botao.textContent = rotulo;
      const e = document.getElementById("erroBaixa");
      e.textContent = "Não consegui salvar. Tente de novo.";
      e.hidden = false;
    }
  }

  const confirmar = document.getElementById("confirmar");
  if (confirmar) confirmar.onclick = () => mover(Number(qtd.value || 1), confirmar);

  const desfazer = document.getElementById("desfazer");
  if (desfazer) desfazer.onclick = () => mover(-1, desfazer);

  const apagar = document.getElementById("apagar");
  if (apagar) apagar.onclick = async () => {
    const id = decodeURIComponent(location.hash.match(/^#c=(.+)$/)[1]);
    const c = achaCafe(id);
    if (!confirm("Apagar " + c.nome + " de vez? Isso não tem como desfazer.")) return;
    apagar.disabled = true; apagar.textContent = "Apagando…";
    try {
      await apagarCafe(id);
      cafes = cafes.filter(x => x.id !== id);
      aba = "estoque";
      location.hash = "";
    } catch {
      apagar.disabled = false; apagar.textContent = "Apagar este café";
      alert("Não consegui apagar. Tente de novo.");
    }
  };

  const pularExt = document.getElementById("pularExt");
  if (pularExt) pularExt.onclick = () => { anotando = false; render(); };

  const salvarExt = document.getElementById("salvarExt");
  if (salvarExt) salvarExt.onclick = async () => {
    const id = decodeURIComponent(location.hash.match(/^#c=(.+)$/)[1]);
    const o = {};
    new FormData(document.getElementById("formExt")).forEach((v,k) => {
      if (String(v).trim()) o[k] = String(v).trim();
    });
    const erroExt = document.getElementById("erroExt");
    if (!Object.keys(o).length){
      erroExt.textContent = "Preencha ao menos um campo, ou toque em Agora não.";
      erroExt.hidden = false;
      return;
    }
    erroExt.hidden = true;
    salvarExt.disabled = true; salvarExt.textContent = "Salvando…";
    try {
      const nova = await salvarExtracao(id, o);
      extracoes.unshift(nova);
      anotando = false;
      render();
    } catch {
      salvarExt.disabled = false; salvarExt.textContent = "Salvar extração";
      erroExt.textContent = "Não consegui salvar. Tente de novo.";
      erroExt.hidden = false;
    }
  };

  document.querySelectorAll(".ext-apagar").forEach(b => b.onclick = async () => {
    if (!confirm("Apagar esta extração?")) return;
    const id = Number(b.dataset.ext);
    b.disabled = true; b.textContent = "Apagando…";
    try {
      await apagarExtracao(id);
      extracoes = extracoes.filter(e => Number(e.id) !== id);
      render();
    } catch {
      b.disabled = false; b.textContent = "Apagar";
    }
  });

  const copiar = document.getElementById("copiar");
  if (copiar) copiar.onclick = async () => {
    try { await navigator.clipboard.writeText(document.getElementById("link").textContent);
          copiar.textContent = "Link copiado"; }
    catch { copiar.textContent = "Selecione e copie o link acima"; }
  };

  const arquivoFoto = document.getElementById("arquivoFoto");
  if (arquivoFoto) arquivoFoto.onchange = () => {
    const f = arquivoFoto.files[0];
    if (!f) return;
    const leitor = new FileReader();
    leitor.onload = () => {
      const img = new Image();
      img.onload = () => {
        const lado = 900;
        const escala = Math.min(1, lado / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * escala);
        cv.height = Math.round(img.height * escala);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        fotoEmBase64 = cv.toDataURL("image/jpeg", 0.75);
        const previa = document.getElementById("previaFoto");
        previa.src = fotoEmBase64;
        previa.hidden = false;
      };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(f);
  };

  const gerar = document.getElementById("gerar");
  if (gerar) gerar.onclick = async () => {
    const f = document.getElementById("form");
    const o = {};
    new FormData(f).forEach((v,k) => { if (String(v).trim()) o[k] = String(v).trim(); });
    if (o.doses) o.doses = Number(o.doses);
    if (fotoEmBase64) o.foto = fotoEmBase64;

    const erro = document.getElementById("erro");
    const avisa = t => { erro.textContent = t; erro.hidden = false; };
    if (!o.id || !o.nome) return avisa("Preencha o código da etiqueta e o nome do café.");
    if (achaCafe(o.id)) return avisa("Já existe um café com o código " + o.id + ".");
    erro.hidden = true;

    gerar.disabled = true; gerar.textContent = "Salvando…";
    try {
      await salvarCafe(o);
      cafes.unshift(Object.assign({}, o, { consumidas: 0 }));
      fotoEmBase64 = "";
      aba = "estoque";
      window.scrollTo(0,0);
      location.hash = "c=" + encodeURIComponent(o.id);
      render();
    } catch {
      gerar.disabled = false; gerar.textContent = "Cadastrar café";
      avisa("Não consegui salvar. Verifique a conexão e tente de novo.");
    }
  };
}

window.addEventListener("hashchange", render);
carregar();
</script>
</body>
</html>
